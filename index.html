  /* Scheda Cognitiva e Dialogo del Cittadino Selezionato */

  .cc-top {

  .cc-actions { display: flex; align-items: center; gap: 6px; }
  .cc-btn {

  #hint {

<canvas id="c"></canvas>

<script>
(() => {
  'use strict';

  // --- PRNG Deterministico (Mulberry32) ---
  function createRng(seed) {
    let s = seed >>> 0;
    return function() {
      s += 0x6D2B79F5;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rng = createRng(0x15321027);
  const randRange = (a, b) => a + (b - a) * rng();
  const pick = (arr) => arr[Math.floor(rng() * arr.length)];

  // --- WebGL2 Setup ---
  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl2', { antialias: true, alpha: false, powerPreference: 'high-performance' });
  if (!gl) return;

  // --- Shaders ---
  const VS_VOXEL = `#version 300 es
  precision highp float;

  layout(location = 0) in vec3 aPos;
  layout(location = 1) in vec3 aNorm;

  layout(location = 2) in vec3 iPos;
  layout(location = 3) in vec3 iScale;
  layout(location = 4) in vec3 iColor;
  // iMeta: x = rotY, y = type (0=solid, 1=window, 2=torch/lantern, 3=sky, 4=rain, 5=festa, 6=smoke), z = sleepHour, w = wakeHour
  layout(location = 5) in vec4 iMeta;

  uniform mat4 uViewProj;

  out vec3 vWorldPos;
  out vec3 vNorm;
  out vec3 vColor;
  out vec4 vMeta;

  void main() {
    float c = cos(iMeta.x);
    float s = sin(iMeta.x);
    vec3 p = aPos * iScale;
    vec3 rp = vec3(p.x * c + p.z * s, p.y, -p.x * s + p.z * c);
    vec3 worldPos = rp + iPos;
    vec3 rn = vec3(aNorm.x * c + aNorm.z * s, aNorm.y, -aNorm.x * s + aNorm.z * c);

    vWorldPos = worldPos;
    vNorm = normalize(rn);
    vColor = iColor;
    vMeta = iMeta;

    gl_Position = uViewProj * vec4(worldPos, 1.0);
  }
  `;

  const FS_VOXEL = `#version 300 es
  precision highp float;

  in vec3 vWorldPos;
  in vec3 vNorm;
  in vec3 vColor;
  in vec4 vMeta;

  uniform float uTime;
  uniform float uHour;
  uniform float uDaylight;
  uniform float uRainAmount;
  uniform float uCloudCover;
  uniform float uFesta;
  uniform float uLightning;
  uniform vec3 uSunColor;
  uniform vec3 uSkyTop;
  uniform vec3 uSkyHorizon;

  out vec4 fragColor;

  void main() {
    float mType = vMeta.y;

    if (mType > 4.5 && mType < 5.5 && uFesta < 0.5) discard;

    // Cielo + lampi durante il temporale
    if (mType > 2.5 && mType < 3.5) {
      float h = clamp((vWorldPos.y - 4.0) / 40.0, 0.0, 1.0);
      vec3 sky = mix(uSkyHorizon, uSkyTop, h);
      sky += vec3(0.45, 0.50, 0.65) * uLightning;
      fragColor = vec4(min(sky, vec3(0.92)), 1.0);
      return;
    }

    // Pioggia
    if (mType > 3.5 && mType < 4.5) {
      vec3 rCol = mix(vec3(0.24, 0.28, 0.36), vec3(0.68, 0.76, 0.85), max(uDaylight, uLightning));
      fragColor = vec4(rCol, 1.0);
      return;
    }

    // Fumo dei comignoli
    if (mType > 5.5 && mType < 6.5) {
      vec3 sCol = mix(vec3(0.22, 0.24, 0.28), vec3(0.66, 0.65, 0.63), uDaylight);
      fragColor = vec4(sCol, 1.0);
      return;
    }

    float sunAngle = (uHour - 5.5) / 13.5 * 3.14159;
    vec3 sunDir = normalize(vec3(cos(sunAngle) * 0.65, max(0.24, sin(sunAngle) * 0.82), 0.38));
    float ndotl = max(dot(vNorm, sunDir), 0.0);

    float hemi = 0.5 + 0.5 * vNorm.y;
    vec3 nightAmb = mix(vec3(0.038, 0.052, 0.090), vec3(0.070, 0.092, 0.150), hemi);
    vec3 dayAmb   = mix(vec3(0.25, 0.23, 0.22), vec3(0.38, 0.40, 0.44), hemi);
    vec3 stormAmb = mix(vec3(0.13, 0.15, 0.18), vec3(0.20, 0.23, 0.28), hemi);

    vec3 activeDayAmb = mix(dayAmb, stormAmb, uCloudCover);
    vec3 ambient = mix(nightAmb, activeDayAmb, uDaylight);

    vec3 baseCol = vColor;
    if (uRainAmount > 0.05) {
      float wetness = uRainAmount * (0.35 + 0.65 * max(vNorm.y, 0.0));
      baseCol *= (1.0 - 0.26 * wetness);
    }

    float sunStrength = uDaylight * (1.0 - uCloudCover * 0.78);
    vec3 sunLight = uSunColor * ndotl * sunStrength + vec3(0.55, 0.62, 0.80) * uLightning * (0.4 + 0.6 * max(vNorm.y, 0.0));
    float ao = 0.88 + 0.12 * clamp(vWorldPos.y / 11.0, 0.0, 1.0);
    vec3 lit = baseCol * (ambient + sunLight) * ao;

    // Finestre delle case: accese a cena e all'alba, spente quando dormono
    if (mType > 0.5 && mType < 1.5) {
      float sleepH = vMeta.z;
      float wakeH  = vMeta.w;
      float eveningOn = smoothstep(18.0, 18.5, uHour) * (1.0 - smoothstep(sleepH - 0.15, sleepH + 0.15, uHour));
      float morningOn = smoothstep(wakeH - 0.15, wakeH + 0.15, uHour) * (1.0 - smoothstep(6.8, 7.2, uHour));
      float stormOn   = step(0.65, uCloudCover) * uDaylight * 0.65;
      float lamp = clamp(max(max(eveningOn, morningOn), stormOn), 0.0, 1.0);
      if (lamp > 0.01) {
        float flicker = 0.93 + 0.07 * sin(uTime * 8.0 + sleepH * 13.0);
        lit = mix(lit, vec3(0.98, 0.71, 0.24) * flicker, lamp);
      }
    }

    // Torce alle porte e lanterna dell'osteria
    if (mType > 1.5 && mType < 2.5) {
      float nightTorch = 1.0 - smoothstep(0.25, 0.65, uDaylight);
      float torchOn = clamp(max(nightTorch, uCloudCover * 0.85), 0.0, 1.0);
      if (torchOn > 0.01) {
        float flicker = 0.89 + 0.11 * sin(uTime * 11.0 + vWorldPos.x * 7.0);
        lit = mix(lit, vec3(1.0, 0.75, 0.26) * flicker, torchOn);
      }
    }

    if (uRainAmount > 0.1) {
      float distFog = clamp((-vWorldPos.z + 20.0) / 85.0, 0.0, 1.0) * uRainAmount * 0.22;
      lit = mix(lit, uSkyHorizon * 0.75, distFog);
    }

    fragColor = vec4(min(lit, vec3(0.92)), 1.0);
  }
  `;

  function compileShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compileShader(gl.VERTEX_SHADER, VS_VOXEL));
  gl.attachShader(prog, compileShader(gl.FRAGMENT_SHADER, FS_VOXEL));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));

  const cubeVerts = new Float32Array([
     0.5,-0.5,-0.5,  1, 0, 0,   0.5, 0.5,-0.5,  1, 0, 0,   0.5, 0.5, 0.5,  1, 0, 0,
     0.5,-0.5,-0.5,  1, 0, 0,   0.5, 0.5, 0.5,  1, 0, 0,   0.5,-0.5, 0.5,  1, 0, 0,
    -0.5,-0.5, 0.5, -1, 0, 0,  -0.5, 0.5, 0.5, -1, 0, 0,  -0.5, 0.5,-0.5, -1, 0, 0,
    -0.5,-0.5, 0.5, -1, 0, 0,  -0.5, 0.5,-0.5, -1, 0, 0,  -0.5,-0.5,-0.5, -1, 0, 0,
    -0.5, 0.5,-0.5,  0, 1, 0,  -0.5, 0.5, 0.5,  0, 1, 0,   0.5, 0.5, 0.5,  0, 1, 0,
    -0.5, 0.5,-0.5,  0, 1, 0,   0.5, 0.5, 0.5,  0, 1, 0,   0.5, 0.5,-0.5,  0, 1, 0,
    -0.5,-0.5, 0.5,  0,-1, 0,  -0.5,-0.5,-0.5,  0,-1, 0,   0.5,-0.5,-0.5,  0,-1, 0,
    -0.5,-0.5, 0.5,  0,-1, 0,   0.5,-0.5,-0.5,  0,-1, 0,   0.5,-0.5, 0.5,  0,-1, 0,
    -0.5,-0.5, 0.5,  0, 0, 1,   0.5,-0.5, 0.5,  0, 0, 1,   0.5, 0.5, 0.5,  0, 0, 1,
    -0.5,-0.5, 0.5,  0, 0, 1,   0.5, 0.5, 0.5,  0, 0, 1,  -0.5, 0.5, 0.5,  0, 0, 1,
     0.5,-0.5,-0.5,  0, 0,-1,  -0.5,-0.5,-0.5,  0, 0,-1,  -0.5, 0.5,-0.5,  0, 0,-1,
     0.5,-0.5,-0.5,  0, 0,-1,  -0.5, 0.5,-0.5,  0, 0,-1,   0.5, 0.5,-0.5,  0, 0,-1,
  ]);

  function mat4Multiply(out, a, b) {
    const a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3];
    const a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7];
    const a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11];
    const a30 = a[12], a31 = a[13], a32 = a[14], a33 = a[15];
    for (let i = 0; i < 4; i++) {
      const b0 = b[i * 4], b1 = b[i * 4 + 1], b2 = b[i * 4 + 2], b3 = b[i * 4 + 3];
      out[i * 4]     = a00 * b0 + a10 * b1 + a20 * b2 + a30 * b3;
      out[i * 4 + 1] = a01 * b0 + a11 * b1 + a21 * b2 + a31 * b3;
      out[i * 4 + 2] = a02 * b0 + a12 * b1 + a22 * b2 + a32 * b3;
      out[i * 4 + 3] = a03 * b0 + a13 * b1 + a23 * b2 + a33 * b3;
    }
    return out;
  }

  function mat4LookAt(eye, target, up) {
    let zx = eye[0] - target[0], zy = eye[1] - target[1], zz = eye[2] - target[2];
    let len = Math.hypot(zx, zy, zz);
    zx /= len; zy /= len; zz /= len;
    let xx = up[1] * zz - up[2] * zy, xy = up[2] * zx - up[0] * zz, xz = up[0] * zy - up[1] * zx;
    len = Math.hypot(xx, xy, xz);
    xx /= len; xy /= len; xz /= len;
    const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
    return new Float32Array([
      xx, yx, zx, 0,  xy, yy, zy, 0,  xz, yz, zz, 0,
      -(xx * eye[0] + xy * eye[1] + xz * eye[2]),
      -(yx * eye[0] + yy * eye[1] + yz * eye[2]),
      -(zx * eye[0] + zy * eye[1] + zz * eye[2]), 1
    ]);
  }

  function mat4Ortho(left, right, bottom, top, near, far) {
    const lr = 1 / (left - right), bt = 1 / (bottom - top), nf = 1 / (near - far);
    return new Float32Array([
      -2 * lr, 0, 0, 0,  0, -2 * bt, 0, 0,  0, 0, 2 * nf, 0,
      (left + right) * lr, (top + bottom) * bt, (far + near) * nf, 1
    ]);
  }

  // --- Costruzione Architettonica del Borgo Vicentino (1532) ---
  const staticVoxels = [];
  const chimneys = [];
  function addBox(px, py, pz, sx, sy, sz, col, rotY = 0, mType = 0, sleepH = 21.0, wakeH = 5.5) {
    staticVoxels.push(px, py, pz, sx, sy, sz, col[0], col[1], col[2], rotY, mType, sleepH, wakeH);
  }

  const PIETRA_VICENZA = [0.82, 0.77, 0.68];
  const PIETRA_OMBRA   = [0.64, 0.60, 0.52];
  const MURO_ANTICO    = [0.58, 0.54, 0.48];
  const INTONACO_OCRA  = [0.81, 0.67, 0.47];
  const INTONACO_ROSA  = [0.78, 0.59, 0.50];
  const INTONACO_CALCE = [0.84, 0.80, 0.73];
  const WALL_COLS = [PIETRA_VICENZA, INTONACO_OCRA, INTONACO_ROSA, INTONACO_CALCE];
  const COPPI_COLS = [
    [0.64, 0.30, 0.20], [0.58, 0.26, 0.18], [0.69, 0.36, 0.22], [0.55, 0.31, 0.22]
  ];
  const SELCIATO_COL = [0.56, 0.53, 0.49];
  const STRADA_COL   = [0.62, 0.58, 0.52];
  const COLLINA_COL  = [0.43, 0.51, 0.31];
  const TERRA_ARATA  = [0.38, 0.28, 0.20];
  const LEGNO_COL    = [0.38, 0.25, 0.16];

  addBox(0, 28, -52, 230, 62, 1, [0.54, 0.70, 0.86], 0, 3);
  addBox(0, -1.5, 4.0, 200, 3.0, 140, COLLINA_COL);

  const terraces = [
    { zMin:   7.2, zMax:  11.5, y: 1.1, col: STRADA_COL },   // Contrada Bassa & Lavatoio
    { zMin:   2.4, zMax:   7.2, y: 2.3, col: STRADA_COL },   // Contrada dei Portici & Osteria

  const globalLog = [];

  function pushBrainLog(text, type = 'mistake') {
    if (globalLog.length > 0 && globalLog[0].text === text) return;
    globalLog.unshift({ text, type });
    if (globalLog.length > 6) globalLog.pop();
    brainEntriesEl.innerHTML = globalLog.map(item =>
      `<div class="log-item ${item.type}">${item.text}</div>`
    ).join('');
  }

  // Ogni agente ha memoria episodica e parametri adattivi che cambiano in base agli errori!
  function initAgentBrain(agent, initialFaith) {
    agent.energy = randRange(78, 98);
    agent.thirst = randRange(8, 22);
    agent.faith = initialFaith; // 0.0 (empirico puro) .. 1.0 (devoto/superstizioso)
    agent.mistakes = 0;
    agent.lessons = []; // array di { id, title, source }
    agent.learnedSet = new Set();
    agent.curfewBuffer = 0.0; // aumenta dopo essere rimasti chiusi fuori dalle mura!
    agent.rainCaution = 0.72; // soglia di pioggia a cui cerca riparo (si abbassa dopo essersi inzuppato!)
    agent.restRatio = 0.25;   // durata delle pause nei campi (aumenta dopo aver stremato i buoi!)
    agent.lastErrorTick = -999;
    agent.lastThought = 'Osservo il cielo e inizio la giornata.';
  }

  function recordMistakeAndLearn(agent, ruleId, mistakeDesc, lessonText, simTick) {
    if (agent.learnedSet.has(ruleId) || (simTick - agent.lastErrorTick) < 6.0) return;
    agent.lastErrorTick = simTick;
    agent.mistakes++;
    agent.learnedSet.add(ruleId);
    agent.lessons.push({ id: ruleId, title: lessonText, source: 'Esperienza diretta' });
    agent.lastThought = `Errore: ${mistakeDesc} → Ho imparato: ${lessonText}`;

    // Adattamento comportamentale reale
    if (ruleId === 'curfew_gate') agent.curfewBuffer = 0.85;
    if (ruleId === 'rain_shelter') agent.rainCaution = 0.32;
    if (ruleId === 'ox_rest') agent.restRatio = 0.42;
    if (ruleId === 'well_ration') agent.faith = Math.max(0.15, agent.faith - 0.28);

    pushBrainLog(`<b>${agent.name}</b> ha sbagliato (${mistakeDesc}) e ha imparato: <i>${lessonText}</i>`, 'learned');
    updateTotalWisdom();
  }

  function shareLessonBetween(a, b, simTick) {
    if ((simTick - (a.lastShareTick || -999)) < 10.0) return;
    for (const lesson of a.lessons) {
      if (!b.learnedSet.has(lesson.id)) {
        a.lastShareTick = simTick;
        b.learnedSet.add(lesson.id);
        b.lessons.push({ id: lesson.id, title: lesson.title, source: `Appreso da ${a.name}` });
        if (lesson.id === 'curfew_gate') b.curfewBuffer = Math.max(b.curfewBuffer, 0.75);
        if (lesson.id === 'rain_shelter') b.rainCaution = Math.min(b.rainCaution, 0.35);
        if (lesson.id === 'well_ration') b.faith = Math.max(0.20, b.faith - 0.15);
        b.lastThought = `${a.name} mi ha avvertito: ${lesson.title}`;
        pushBrainLog(`<b>${a.name}</b> ha istruito <b>${b.name}</b>: <i>${lesson.title}</i>`, 'social');
        updateTotalWisdom();
        break;
      }
    }
  }

  function updateTotalWisdom() {
    let total = 0;
    for (const v of villagers) total += v.lessons.length;
    wisdomScoreEl.textContent = `Regole apprese: ${total}`;

    cam.panX = Math.max(cam.minPanX, Math.min(cam.maxPanX, cam.panX));

    const w = Math.max(1, Math.floor(window.innerWidth * dpr));
    const h = Math.max(1, Math.floor(window.innerHeight * dpr));

    for (const v of villagers) {
      if (!v.visible) continue;
      const p = projectToScreen(v.x, v.y + 0.45, v.z);
      const d = Math.hypot(p.sx - clientX, p.sy - clientY);
      if (d < bestDist) { bestDist = d; best = v; }
    }
    if (best) {
      selectedVillager = best;
      updateCitizenCard();
    } else {
      selectedVillager = null;
      followSelected = false;
      updateFollowBtn();
      cardEl.classList.remove('visible');
    }
  }

  // --- Scrittura Istanze Dinamiche ---
  let dynPtr = 0;
  function pushDyn(px, py, pz, sx, sy, sz, col, rotY = 0, mType = 0) {
    if (dynPtr >= MAX_DYN) return;
    const idx = STATIC_FLOATS + dynPtr * 13;
    instanceData[idx]      = px; instanceData[idx + 1]  = py; instanceData[idx + 2]  = pz;
    instanceData[idx + 3]  = sx; instanceData[idx + 4]  = sy; instanceData[idx + 5]  = sz;
    instanceData[idx + 6]  = col[0]; instanceData[idx + 7] = col[1]; instanceData[idx + 8] = col[2];
    instanceData[idx + 9]  = rotY; instanceData[idx + 10] = mType;
    instanceData[idx + 11] = 0; instanceData[idx + 12] = 0;
    dynPtr++;
  }

  function drawPerson(v, yaw, stride, armPhase, toolType, t) {
    if (v === selectedVillager) {
      pushDyn(v.x, v.y + 0.03, v.z, 0.58, 0.04, 0.58, [0.98, 0.78, 0.28], t * 1.6, 2);
    }
    pushDyn(v.x + stride, v.y + 0.14, v.z - 0.05, 0.08, 0.28, 0.08, v.hose, yaw);
    pushDyn(v.x - stride, v.y + 0.14, v.z + 0.05, 0.08, 0.28, 0.08, v.hose, yaw);
    pushDyn(v.x, v.y + 0.43, v.z, 0.21, 0.32, 0.16, v.tunic, yaw);
    const bob = Math.abs(Math.sin(armPhase)) * 0.02;
    pushDyn(v.x, v.y + 0.67 - bob, v.z, 0.15, 0.15, 0.15, [0.80, 0.64, 0.52], yaw);
    if (v.hat) pushDyn(v.x, v.y + 0.76 - bob, v.z, 0.21, 0.06, 0.21, v.hat, yaw);

    if (toolType === 'beater') {
      const beatY = 0.45 + Math.sin(t * 7.5 + v.x) * 0.14;
      pushDyn(v.x, v.y + beatY, v.z - 0.24, 0.08, 0.05, 0.32, LEGNO_COL, Math.sin(t * 7.5) * 0.4);
      pushDyn(v.x, v.y + 0.49, v.z - 0.42, 0.34, 0.06, 0.22, [0.84, 0.80, 0.74], 0);
    } else if (toolType === 'flask') {
      const drinkY = 0.56 + Math.sin(t * 2.5) * 0.08;
      pushDyn(v.x + 0.14, v.y + drinkY, v.z, 0.12, 0.16, 0.12, [0.48, 0.32, 0.18], 0);
    } else if (toolType === 'halberd') {
      pushDyn(v.x + 0.18, v.y + 0.65, v.z, 0.04, 1.30, 0.04, LEGNO_COL, 0);
      pushDyn(v.x + 0.18, v.y + 1.25, v.z, 0.12, 0.24, 0.03, [0.65, 0.68, 0.72], 0);
    }
  }

  let smoothWeather = { sun: 0.98, rain: 0.0, cloud: 0.20, sunCol: [0.75, 0.71, 0.63], skyTop: [0.48, 0.68, 0.86], skyHor: [0.68, 0.76, 0.82] };
  const lerp = (a, b, t) => a + (b - a) * t;
  const lerp3 = (out, a, b, t) => { out[0] = lerp(a[0], b[0], t); out[1] = lerp(a[1], b[1], t); out[2] = lerp(a[2], b[2], t); };

  let simClock = 0.0;
  let uiRefreshTimer = 0.0;

  function renderFrame(rawTime, dt) {
    const scaledDt = dt * timeSpeed;
    simClock += scaledDt;
    uiRefreshTimer += dt;

    processKeyboard(dt);

    // Orologio (1 giorno = 96s a 1x)
    if (timeMode === 'auto') {
      const prevH = currentHour;
      currentHour = (5.0 + (simClock / 96.0) * 24.0) % 24.0;
      if (currentHour < prevH) dayCount++;
    } else {
      currentHour = timeMode;
    }

    const nextW = (weatherMode === 'auto') ? Math.floor(((simClock + 12.0) / 22.0) % 4) : weatherMode;
    currentWeatherIdx = nextW;

    const targetW = WEATHER_STATES[currentWeatherIdx];
    const blend = Math.min(1.0, dt * 1.8);
    smoothWeather.sun = lerp(smoothWeather.sun, targetW.sun, blend);
    smoothWeather.rain = lerp(smoothWeather.rain, targetW.rain, blend);
    smoothWeather.cloud = lerp(smoothWeather.cloud, targetW.cloud, blend);
    lerp3(smoothWeather.sunCol, smoothWeather.sunCol, targetW.sunCol, blend);
    lerp3(smoothWeather.skyTop, smoothWeather.skyTop, targetW.skyTop, blend);
    lerp3(smoothWeather.skyHor, smoothWeather.skyHor, targetW.skyHor, blend);

    // Lampi sporadici durante il temporale
    let lightning = 0.0;
    if (currentWeatherIdx === 3) {
      const flash = Math.sin(simClock * 17.3) * Math.sin(simClock * 43.7);
      if (flash > 0.94) lightning = (flash - 0.94) * 14.0;
    }

    let daylight = 0.0;
    if (currentHour >= 5.0 && currentHour <= 19.5) {
      daylight = Math.pow(Math.max(0.0, Math.sin(((currentHour - 5.0) / 14.5) * Math.PI)), 0.55);
    }
    const warmSunset = Math.exp(-Math.pow((currentHour - 5.8) / 1.1, 2.0)) + Math.exp(-Math.pow((currentHour - 18.6) / 1.1, 2.0));

    const nightTop = [0.04, 0.06, 0.12], nightHor = [0.08, 0.11, 0.18], duskHor = [0.84, 0.46, 0.24];
    const effSkyTop = [
      lerp(nightTop[0], smoothWeather.skyTop[0], daylight),
      lerp(nightTop[1], smoothWeather.skyTop[1], daylight),
      lerp(nightTop[2], smoothWeather.skyTop[2], daylight),
    ];
    const effSkyHor = [
      lerp(lerp(nightHor[0], smoothWeather.skyHor[0], daylight), duskHor[0], warmSunset * 0.45 * (1.0 - smoothWeather.cloud)),
      lerp(lerp(nightHor[1], smoothWeather.skyHor[1], daylight), duskHor[1], warmSunset * 0.35 * (1.0 - smoothWeather.cloud)),
      lerp(lerp(nightHor[2], smoothWeather.skyHor[2], daylight), duskHor[2], warmSunset * 0.25 * (1.0 - smoothWeather.cloud)),
    ];

    const hh = String(Math.floor(currentHour)).padStart(2, '0');
    const mm = String(Math.floor((currentHour % 1) * 60)).padStart(2, '0');
    let phaseName = 'Notte (Mura chiuse)';
    if (currentHour >= 4.75 && currentHour < 7.0) phaseName = 'Alba (Primi lavori)';
    else if (currentHour >= 7.0 && currentHour < 12.5) phaseName = 'Mattino';
    else if (currentHour >= 12.5 && currentHour < 18.0) phaseName = 'Pomeriggio';
    else if (currentHour >= 18.0 && currentHour < 20.5) phaseName = 'Sera (Cena)';
    clockLabel.textContent = `Giorno ${dayCount} · ${hh}:${mm} · ${phaseName} · ${WEATHER_STATES[currentWeatherIdx].name}`;

    dynPtr = 0;

    // 1. Portoni delle Mura chiusi di notte
    const gatesClosed = (currentHour >= 19.0 || currentHour < 4.75);
    if (gatesClosed) {
      pushDyn(0, 1.35, 12.2, 2.1, 2.7, 0.18, LEGNO_COL, 0);
      pushDyn(13.2, 2.3 + 1.25, 4.8, 0.18, 2.5, 2.1, LEGNO_COL, 0);
    }

    // 2. Fumo dai comignoli veneziani durante la cena serale (18:00-20:45) e al mattino presto (5:00-7:30)
    const smokeActive = (currentHour >= 18.0 && currentHour <= 20.8) || (currentHour >= 5.0 && currentHour <= 7.5);
    if (smokeActive) {
      for (let i = 0; i < chimneys.length; i += 2) {
        const ch = chimneys[i];
        for (let p = 0; p < 2; p++) {
          const age = (simClock * 0.7 + ch.phase + p * 0.5) % 1.0;
          const sy = ch.y + age * 1.4;
          const sx = ch.x + Math.sin(simClock * 1.5 + ch.phase + age * 3.0) * 0.18 * age;
          const sz = ch.z - age * 0.15;
          const szBox = 0.14 + age * 0.16;
          pushDyn(sx, sy, sz, szBox, szBox, szBox, [0.65, 0.65, 0.65], age, 6);
        }
      }
    }

    // 3. Buoi con Aratro fuori dalle mura + Apprendimento dalla fatica
    const driverA = villagers[0];
    const farmersActive = (currentHour >= 4.75 && currentHour <= (18.6 - driverA.curfewBuffer)) && (smoothWeather.rain < 0.78);

    // Se i contadini tardano oltre le 19.0 quando i portoni chiudono -> errore di coprifuoco!
    if (currentHour >= 19.0 && currentHour < 19.4 && driverA.curfewBuffer === 0.0) {
      recordMistakeAndLearn(driverA, 'curfew_gate', 'Rimasto fuori dai portoni chiusi', 'Staccare i buoi 45 min prima dell’Ave Maria', simClock);
    }

    for (let i = 0; i < oxTeams.length; i++) {
      const ot = oxTeams[i];
      if (!farmersActive) continue;

      const driver = villagers[i];
      const period = 20.0;
      const sub = (simClock + i * 7.0) % period;
      const workEnd = period * (1.0 - driver.restRatio);
      ot.resting = (sub > workEnd);

      // Se lavora senza pause sufficienti durante la siccità -> i buoi si stremamo -> impara!
      if (!ot.resting && currentWeatherIdx === 0) {
        ot.oxFatigue += scaledDt * 2.5;
        if (ot.oxFatigue > 55) {
          recordMistakeAndLearn(driver, 'ox_rest', 'Sforzati i buoi sotto il sole secco', 'Allungare le pause col fiasco nei campi', simClock);
          ot.oxFatigue = 25;
        }
      } else if (ot.resting) {
        ot.oxFatigue = Math.max(10, ot.oxFatigue - scaledDt * 5.0);
      }

      const moveT = Math.floor((simClock + i * 7.0) / period) * workEnd + Math.min(sub, workEnd);
      const u = (ot.phase + moveT * 0.028) % 1.0;
      const goingRight = u < 0.5;
      const tri = goingRight ? (u * 2.0) : (2.0 - u * 2.0);
      ot.x = ot.xMin + (ot.xMax - ot.xMin) * tri;
      ot.dir = goingRight ? 1 : -1;

      const step = ot.resting ? 0 : Math.sin(simClock * 5.0) * 0.05;
      for (const dz of [-0.32, 0.32]) {
        const bx = ot.x + ot.dir * 0.65;
        pushDyn(bx, 0.48, ot.z + dz, 0.88, 0.42, 0.34, [0.85, 0.83, 0.78]);
        pushDyn(bx + ot.dir * 0.52, 0.58, ot.z + dz, 0.28, 0.26, 0.24, [0.82, 0.80, 0.75]);
        pushDyn(bx + ot.dir * 0.56, 0.74, ot.z + dz - 0.14, 0.06, 0.14, 0.05, [0.72, 0.68, 0.58]);
        pushDyn(bx + ot.dir * 0.56, 0.74, ot.z + dz + 0.14, 0.06, 0.14, 0.05, [0.72, 0.68, 0.58]);
        pushDyn(bx - 0.28 + step, 0.16, ot.z + dz - 0.10, 0.09, 0.32, 0.09, [0.74, 0.72, 0.68]);
        pushDyn(bx - 0.28 - step, 0.16, ot.z + dz + 0.10, 0.09, 0.32, 0.09, [0.74, 0.72, 0.68]);
        pushDyn(bx + 0.28 - step, 0.16, ot.z + dz - 0.10, 0.09, 0.32, 0.09, [0.74, 0.72, 0.68]);
        pushDyn(bx + 0.28 + step, 0.16, ot.z + dz + 0.10, 0.09, 0.32, 0.09, [0.74, 0.72, 0.68]);
      }
      pushDyn(ot.x + ot.dir * 0.95, 0.66, ot.z, 0.10, 0.08, 0.92, LEGNO_COL);
      pushDyn(ot.x + ot.dir * 0.15, 0.42, ot.z, 1.45, 0.07, 0.07, LEGNO_COL);
      pushDyn(ot.x - ot.dir * 0.45, 0.22, ot.z, 0.42, 0.24, 0.16, [0.34, 0.36, 0.40]);
      pushDyn(ot.x - ot.dir * 0.20, 0.12, ot.z + 0.55, 0.16, 0.22, 0.16, [0.48, 0.32, 0.18]);
    }

    // 4. Panni stesi al lavatoio
    if (currentHour >= 6.5 && currentHour <= 18.0 && smoothWeather.rain < 0.3) {
      const cols = [[0.84, 0.80, 0.74], [0.72, 0.32, 0.26], [0.30, 0.48, 0.66], [0.80, 0.76, 0.68], [0.58, 0.46, 0.32]];
      for (let g = 0; g < 5; g++) {
        const sway = Math.sin(simClock * 2.2 + g) * 0.06;
        pushDyn(4.9 + g * 0.95, 1.1 + 1.15, 7.85 + sway, 0.32, 0.44, 0.04, cols[g], sway * 2.0);
      }
    }

    // 5. Aggiornamento Agenti Cognitivi, Errori e Diffusione Sociale
    const isNight = (currentHour >= 19.2 || currentHour < 4.75);

    for (let i = 0; i < villagers.length; i++) {
      const v = villagers[i];
      v.visible = true;
      let yaw = 0, stride = 0, armPhase = 0, toolType = null;

      // Metabolismo & apprendimento ambientale
      if (v.visible && !isNight) {
        v.energy = Math.max(25, v.energy - scaledDt * (currentWeatherIdx === 0 ? 0.45 : 0.22));
        v.thirst = Math.min(95, v.thirst + scaledDt * (currentWeatherIdx === 0 ? 0.85 : 0.35));
      } else {
        v.energy = Math.min(100, v.energy + scaledDt * 1.2);
        v.thirst = Math.max(5, v.thirst - scaledDt * 1.0);
      }

      // Errore siccità: chi si affida solo alla fede senza razionare acqua al pozzo
      if (currentWeatherIdx === 0 && v.faith > 0.78 && v.kind === 'citizen' && Math.random() < 0.008) {
        recordMistakeAndLearn(v, 'well_ration', 'Ignorato il calo del pozzo fidandosi solo delle prediche', 'Razionare l’acqua del pozzo durante la siccità', simClock);
      }

      if (v.kind === 'guard') {
        toolType = 'halberd';
        yaw = Math.atan2(-(v.faceZ - v.z), v.faceX - v.x);
      } else if (v.kind === 'ox_driver') {
        if (!farmersActive) { v.visible = false; continue; }
        const ot = oxTeams[v.oxIdx];
        v.resting = ot.resting;
        if (v.resting) { v.thirst = Math.max(10, v.thirst - scaledDt * 3.0); v.energy = Math.min(95, v.energy + scaledDt * 1.5); }
        v.x = ot.x - ot.dir * 0.85;
        v.y = 0.0;
        v.z = ot.z + (ot.resting ? 0.45 : 0.0);
        yaw = ot.resting ? (v.oxIdx === 0 ? -Math.PI * 0.4 : Math.PI * 0.4) : (ot.dir > 0 ? 0 : Math.PI);
        stride = ot.resting ? 0 : Math.sin(simClock * 5.0) * 0.06;
        toolType = ot.resting ? 'flask' : null;
      } else if (v.kind === 'vineyard') {
        if (currentHour < 5.0 || currentHour > (18.5 - v.curfewBuffer) || smoothWeather.rain > v.rainCaution) {
          v.visible = false; continue;
        }
        yaw = 0.2;
      } else if (v.kind === 'washer') {
        if (currentHour < 6.0 || currentHour > 17.5 || smoothWeather.rain > 0.82) {
          v.visible = false; continue;
        }
        yaw = Math.PI * 0.5;
        toolType = 'beater';
      } else if (v.kind === 'priest') {
        if (currentHour >= 20.5 || currentHour < 5.2) { v.visible = false; continue; }
        yaw = Math.PI * 0.5;
      } else if (v.kind === 'townfolk') {
        if (isNight || smoothWeather.rain > 0.75) { v.visible = false; continue; }
        yaw = Math.atan2(-(v.faceZ - v.z), v.faceX - v.x);
      } else {
        // Cittadini nelle contrade: se piove oltre la loro soglia appresa, rientrano subito al riparo!
        if (smoothWeather.rain > v.rainCaution) {
          if (!v.learnedSet.has('rain_shelter') && smoothWeather.rain > 0.72) {
            recordMistakeAndLearn(v, 'rain_shelter', 'Sorpreso dal temporale in strada', 'Rientrare subito sotto i portici alle prime gocce', simClock);
          }
          v.visible = false;
          continue;
        }
        if (isNight || currentHour < 6.2) { v.visible = false; continue; }

        if (festaActive && (i % 2 === 0)) {
          const ang = i * 0.85 + Math.sin(simClock * 1.5 + i) * 0.15;
          v.x = 0.4 + Math.cos(ang) * 2.1;
          v.y = 3.6;
          v.z = 0.4 + Math.sin(ang) * 1.5;
          yaw = ang + Math.PI;
        } else {
          let u = (v.phase + simClock * v.speed) % 1.0;
          if (u < 0) u += 1.0;
          const movingRight = u < 0.5;
          const tri = movingRight ? (u * 2.0) : (2.0 - u * 2.0);
          v.x = v.path.x0 + (v.path.x1 - v.path.x0) * tri;
          v.y = v.path.y;
          v.z = v.path.z + v.zOff;
          yaw = movingRight ? 0.0 : Math.PI;
          stride = Math.sin(simClock * 8.2 + v.phase * 10.0) * 0.07;
        }
      }

      drawPerson(v, yaw, stride, armPhase, toolType, simClock);
    }

    // Diffusione sociale: quando due cittadini visibili sono vicini (< 1.4 unità), si scambiano regole apprese!
    for (let i = 0; i < villagers.length; i++) {
      if (!villagers[i].visible || villagers[i].lessons.length === 0) continue;
      for (let j = i + 1; j < villagers.length; j++) {
        if (!villagers[j].visible) continue;
        if (Math.abs(villagers[i].y - villagers[j].y) < 0.2 && Math.hypot(villagers[i].x - villagers[j].x, villagers[i].z - villagers[j].z) < 1.35) {
          shareLessonBetween(villagers[i], villagers[j], simClock);
          shareLessonBetween(villagers[j], villagers[i], simClock);
        }
      }
    }

    // Segui cittadino selezionato con la camera
    if (followSelected && selectedVillager && selectedVillager.visible) {
      cam.panX = lerp(cam.panX, selectedVillager.x, Math.min(1.0, dt * 4.0));
      cam.panZ = lerp(cam.panZ, selectedVillager.z, Math.min(1.0, dt * 4.0));
      updateCameraMatrices();
    }

    if (uiRefreshTimer > 0.35) {
      uiRefreshTimer = 0.0;
      updateCitizenCard();
    }

    // 6. Gocce di pioggia
    const activeDrops = Math.floor(RAIN_COUNT * smoothWeather.rain);
    for (let i = 0; i < activeDrops; i++) {
      const d = rainDrops[i];
      const ry = 18.0 - ((simClock * d.speed + d.phase) % 17.5);
      pushDyn(d.x, ry, d.z, 0.026, 0.40, 0.026, [0.65, 0.74, 0.84], 0.08, 4);
    }

    const totalInstances = STATIC_COUNT + dynPtr;
    gl.bindBuffer(gl.ARRAY_BUFFER, instanceVbo);
    gl.bufferSubData(gl.ARRAY_BUFFER, STATIC_FLOATS * 4, instanceData.subarray(STATIC_FLOATS, totalInstances * 13));

    gl.enable(gl.DEPTH_TEST);
    gl.clearColor(effSkyHor[0], effSkyHor[1], effSkyHor[2], 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    gl.useProgram(prog);
    gl.uniformMatrix4fv(uViewProj, false, viewProj);
    gl.uniform1f(uTime, simClock);
    gl.uniform1f(uHour, currentHour);
    gl.uniform1f(uDaylight, daylight);
    gl.uniform1f(uRainAmount, smoothWeather.rain);
    gl.uniform1f(uCloudCover, smoothWeather.cloud);
    gl.uniform1f(uFesta, festaActive ? 1.0 : 0.0);
    gl.uniform1f(uLightning, lightning);
    gl.uniform3fv(uSunColor, smoothWeather.sunCol);
    gl.uniform3fv(uSkyTop, effSkyTop);
    gl.uniform3fv(uSkyHorizon, effSkyHor);

    gl.bindVertexArray(vao);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, 36, totalInstances);
  }

  // Log iniziale
  pushBrainLog('Simulazione <b>HYDROGEN</b> avviata: i cittadini osservano cielo, mura e raccolti e imparano dagli errori.', 'social');

  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.min(0.1, (now - lastTime) * 0.001);
    lastTime = now;
    renderFrame(now * 0.001, dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
